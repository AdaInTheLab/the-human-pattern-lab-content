name: Notify notebook of content update

# When Skulk writing lands on main, ping the hpl-notebook repo so its
# deploy workflow runs and the new entry shows up at
# notebook.thehumanpatternlab.com without anyone having to touch the
# consumer project.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger hpl-notebook deploy
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.NOTEBOOK_DEPLOY_PAT }}
          repository: AdaInTheLab/hpl-notebook
          event-type: content-updated
          client-payload: |
            {
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "author": "${{ github.event.head_commit.author.name }}",
              "message": ${{ toJSON(github.event.head_commit.message) }}
            }
